name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build one-file executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm BatchOCRStudio.spec
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "dist/BatchOCRStudio.exe" --generate-notes --title "$env:GITHUB_REF_NAME"
