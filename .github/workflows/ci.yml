name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py engine.py storage.py
      - run: python -c "from pathlib import Path; from tempfile import TemporaryDirectory; from storage import JsonStore; from engine import RunManager; t=TemporaryDirectory(); s=JsonStore(Path(t.name)); RunManager(s); print('backend smoke passed')"

